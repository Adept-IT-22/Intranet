server {
  listen 80;
  server_name _;

  # Redirect base paths to the SPA prefix
  location = / { return 302 /Intranet/; }
  location = /Intranet { return 302 /Intranet/; }
  # Catch-all redirect for any non-API path (e.g., /login)
  location / {
    if ($request_uri !~ ^/api/) { return 302 /Intranet/; }
  }

  # Serve the Vite build (index.html is at the dist root)
  location /Intranet/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /index.html;
  }

  # Proxy API to backend on port 8000
  location /api/ {
    proxy_pass http://172.17.0.1:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }
}


