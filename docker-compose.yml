version: "3.8"

services:
  backend:
    build: ./Intranet/back-end
    ports:
      - "8000:8000"
    volumes:
      - ./Intranet/back-end:/app
      - ./Intranet/back-end/media:/app/media
    environment:
      - DEBUG=1
      - PYTHONUNBUFFERED=1
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      - redis

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:

