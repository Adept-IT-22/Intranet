# Azure DevOps Pipeline for Intranet Application
trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.11'
  nodeVersion: '18.x'

stages:
- stage: Build
  displayName: 'Build Application'
  jobs:
  - job: BuildBackend
    displayName: 'Build Django Backend'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
      displayName: 'Use Python $(pythonVersion)'

    - script: |
        cd back-end
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: 'Install Python dependencies'

    - script: |
        cd back-end
        python manage.py collectstatic --noinput
        python manage.py migrate --run-syncdb
      displayName: 'Prepare Django application'

    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: 'back-end'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/backend.zip'
      displayName: 'Archive backend files'

  - job: BuildFrontend
    displayName: 'Build React Frontend'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '$(nodeVersion)'
      displayName: 'Use Node.js $(nodeVersion)'

    - script: |
        cd frontend
        npm ci
        npm run build
      displayName: 'Install dependencies and build'

    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: 'frontend/dist'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/frontend.zip'
      displayName: 'Archive frontend build'

  - job: PublishArtifacts
    displayName: 'Publish Build Artifacts'
    dependsOn: [BuildBackend, BuildFrontend]
    steps:
    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)'
        artifactName: 'drop'
      displayName: 'Publish artifacts'

- stage: Deploy
  displayName: 'Deploy to Azure'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployToAzure
    displayName: 'Deploy to Azure App Service'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            inputs:
              azureSubscription: '$(azureSubscription)'
              appType: 'webAppLinux'
              appName: '$(webAppName)'
              package: '$(Pipeline.Workspace)/drop/backend.zip'
              runtimeStack: 'PYTHON|3.11'
            displayName: 'Deploy Backend to Azure App Service'

          - task: AzureStaticWebApp@0
            inputs:
              azureSubscription: '$(azureSubscription)'
              app_location: '/'
              api_location: ''
              output_location: 'dist'
              azure_static_web_apps_api_token: '$(staticWebAppToken)'
            displayName: 'Deploy Frontend to Azure Static Web Apps'
