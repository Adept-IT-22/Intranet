name: Deploy to Azure App Service

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AZURE_WEBAPP_NAME: adept-intranet
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    # Build Frontend
    - name: 'Build Frontend'
      run: |
        cd frontend
        npm ci
        npm run build
        
    # Copy frontend build to backend static files
    - name: 'Copy Frontend to Backend'
      run: |
        mkdir -p back-end/static
        cp -r frontend/dist/* back-end/static/
        
    # Install backend dependencies
    - name: 'Install Backend Dependencies'
      run: |
        cd back-end
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    # Collect static files
    - name: 'Collect Static Files'
      run: |
        cd back-end
        python manage.py collectstatic --noinput --settings=backend.settings_azure
        
    # Create deployment package
    - name: 'Create Deployment Package'
      run: |
        cd back-end
        zip -r ../deployment.zip . -x "venv/*" "__pycache__/*" "*.pyc" ".git/*"
        
    # Deploy to Azure Web App
    - name: 'Deploy to Azure Web App'
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: './deployment.zip'