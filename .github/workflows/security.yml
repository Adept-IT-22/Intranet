name: Security Pipeline (SAST & DAST)

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # SAST: Semgrep Scan (Static Analysis)
  # ==========================================
  semgrep-sast:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Semgrep Full Repository Scan
        uses: semgrep/semgrep-action@v1
        with:
          audit: true # <--- This forces a full repository scan instead of just PR changes
          config: >-
            p/default
            p/python
            p/django
            p/javascript
            p/typescript
            p/security-audit
            p/secrets
          generateSarif: "1"
        env:
          SEMGREP_ARGS: --sarif --output=semgrep.sarif --disable-nosem --error --include '*'
          
      - name: Upload SARIF report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results
          path: semgrep.sarif

  # ==========================================
  # DAST: Ephemeral ZAP Scan (Dynamic Analysis)
  # ==========================================
  zap-dast:
    name: ZAP Ephemeral Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Dummy .env for CI
        run: |
          echo "DJANGO_SETTINGS_MODULE=backend.settings_production" >> .env
          echo "DJANGO_SECRET_KEY=ci-secret-key-12345" >> .env
          echo "DATABASE_URL=postgresql://intranetuser:intranetpass@db:5432/intranetdb" >> .env
          echo "POSTGRES_DB=intranetdb" >> .env
          echo "POSTGRES_USER=intranetuser" >> .env
          echo "POSTGRES_PASSWORD=intranetpass" >> .env
          echo "POSTGRES_HOST=db" >> .env
          echo "REDIS_URL=redis://redis:6379/0" >> .env
          echo "DEBUG=True" >> .env

      - name: Start Application (Docker Compose)
        run: |
          docker compose up -d --build
          
      - name: Wait for Backend Health
        run: |
          echo "Waiting for Django to be ready..."
          # Poll the root API endpoint until it returns 200
          timeout 60s sh -c 'until curl -s http://localhost:8001/api/signup/ > /dev/null; do sleep 5; done' || (docker compose logs && exit 1)

      - name: Create Active CI Test User
        run: |
          # Create an active user directly in the DB to bypass admin approval logic
          docker exec intranet-backend python manage.py shell -c "from django.contrib.auth import get_user_model; User = get_user_model(); u, created = User.objects.get_or_create(username='zap-bot', defaults={'email':'zap@adept.local'}); u.set_password('ZapPass123!'); u.is_active=True; u.save()"

      - name: Obtain JWT Token
        id: auth
        run: |
          # Login to get the SimpleJWT access token
          RESPONSE=$(curl -s -X POST http://localhost:8001/api/token/ \
            -H "Content-Type: application/json" \
            -d '{"username":"zap-bot", "password":"ZapPass123!"}')
          
          TOKEN=$(echo $RESPONSE | jq -r '.access')
          
          if [ "$TOKEN" == "null" ] || [ -z "$TOKEN" ]; then
            echo "Failed to obtain CI auth token. Response: $RESPONSE"
            exit 1
          fi
          
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Create ZAP Auth Hook
        run: |
          echo "def zap_started(zap, target):" > zap-hooks.py
          echo "    # Import the OpenAPI schema we just enabled" >> zap-hooks.py
          echo "    zap.openapi.import_url('http://localhost:8001/api/schema/')" >> zap-hooks.py
          echo "" >> zap-hooks.py
          echo "def sending_request(zap, msg, is_sender_wildcard):" >> zap-hooks.py
          echo "    import os" >> zap-hooks.py
          echo "    token = os.environ.get('ZAP_AUTH_HEADER_VALUE')" >> zap-hooks.py
          echo "    if token:" >> zap-hooks.py
          echo "        msg.getRequestHeader().setHeader('Authorization', token)" >> zap-hooks.py
          echo "    return msg" >> zap-hooks.py

      - name: Run ZAP Full Scan
        run: |
          touch zap_report.html
          chmod 777 zap_report.html
          docker run --rm --network="host" \
            -u root \
            -v $(pwd):/zap/wrk/:rw \
            -e ZAP_AUTH_HEADER_VALUE="Bearer ${{ steps.auth.outputs.token }}" \
            ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
            -t http://localhost:8001 \
            -I \
            --hook /zap/wrk/zap-hooks.py \
            -r zap_report.html

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-intranet-report
          path: zap_report.html

      - name: Stop Application
        if: always()
        run: docker compose down
