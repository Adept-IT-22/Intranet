# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - adept-intranet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://index.docker.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_c04649ffe171402d9f8c8e28b2a59aa7 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_74267884ccd941109be664697d0bb338 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: index.docker.io/${{ secrets.AzureAppService_ContainerUsername_c04649ffe171402d9f8c8e28b2a59aa7 }}/adept-intranet:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'adept-intranet'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_58877a49f87048fb8708e42296594c7e }}
        images: 'index.docker.io/${{ secrets.AzureAppService_ContainerUsername_c04649ffe171402d9f8c8e28b2a59aa7 }}/adept-intranet:${{ github.sha }}'